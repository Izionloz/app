# Managed by mgux-hud-ctl: adds the HUD map arguments (MGUX_HUD_ARGS, from
# /var/opt/mgux-hud/args.env, empty unless the HUD is chosen) to the start of
# waze-on-cluster. Same command line as the tool's own unit otherwise.
[Service]
EnvironmentFile=-/var/opt/mgux-hud/args.env
ExecStart=
ExecStart=/var/opt/waze-on-cluster/current/waze-on-cluster -c /var/opt/waze-on-cluster/current/waze-on-cluster.conf $WOC_SRC_CROP $MGUX_HUD_ARGS