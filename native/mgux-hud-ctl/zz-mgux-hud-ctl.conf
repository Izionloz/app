# Managed by mgux-hud-ctl: waze-on-cluster draws through the HUD map helper's render
# proxy (MGUX_HUD_ARGS = -s render_socket=..., from /var/opt/mgux-hud/args.env), which
# moves the map between the cluster and the HUD and resizes it while it runs. Same
# command line as the tool's own unit otherwise.
[Unit]
Wants=mgux-hud-ctl.service
After=mgux-hud-ctl.service

[Service]
EnvironmentFile=-/var/opt/mgux-hud/args.env
ExecStart=
ExecStart=/var/opt/waze-on-cluster/current/waze-on-cluster -c /var/opt/waze-on-cluster/current/waze-on-cluster.conf $WOC_SRC_CROP $MGUX_HUD_ARGS