name: release
# Publishes what catalog.json names: for each component built from this repository whose release
# (tag <id>@<version>) is not there yet, a release with its artifact; then catalog.json, with this
# commit, on the `catalog` release the Store reads. Runs on main, by hand, or on a pushed tag release-*.
on:
  push:
    branches: [main]
    tags: ['release-*']
  workflow_dispatch:
permissions:
  contents: write
concurrency: release
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # the designer is built with the idrive7-apps kit (MIT), at the commit it was checked against
      - uses: actions/checkout@v4
        with:
          repository: cauliflowermossgrape/idrive7-apps
          ref: 990c105870edb21bd8f23796fcf95182530790e8
          path: .kit
          persist-credentials: false
      # the EVA cluster app is built with bimmer-lab/apps (MIT), at the commit its patch (eva/engine.patch) was made against
      - uses: actions/checkout@v4
        with:
          repository: bimmer-lab/apps
          ref: c9f8a8ee2f8885ce1ff1d0ca67bd00af0e68bdb2
          path: .eva-kit
          persist-credentials: false
      - run: npm test
      - name: Build and check the artifacts against catalog.json
        run: mkdir -p dist && node release/catalog.js --out dist --check --kit .kit --eva-kit .eva-kit --commit "$GITHUB_SHA" --write dist/catalog.json > dist/built.json
      - name: Releases for new versions
        run: |
          node -e 'JSON.parse(require("fs").readFileSync("dist/built.json","utf8")).filter(b=>b.built).forEach(b=>console.log(b.tag+" "+b.file))' |
          while read -r tag file; do
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "$tag: already released"
            else
              gh release create "$tag" "$file" --target "$GITHUB_SHA" --title "$tag" --notes "Built from $GITHUB_SHA by the release workflow."
            fi
          done
      - name: Components not built here must already be released
        run: |
          node -e 'JSON.parse(require("fs").readFileSync("dist/built.json","utf8")).filter(b=>!b.built).forEach(b=>console.log(b.id+"@"+b.version))' |
          while read -r tag; do
            gh release view "$tag" >/dev/null 2>&1 || echo "::warning::$tag is in catalog.json but has no release"
          done
      - name: Catalog
        run: |
          if gh release view catalog >/dev/null 2>&1; then
            gh release upload catalog dist/catalog.json --clobber
            gh release edit catalog --draft=false
          else
            gh release create catalog dist/catalog.json --title Catalog --notes "The Store's catalog of this repository."
          fi
